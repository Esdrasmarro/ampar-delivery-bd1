<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Ampar Delivery'">Ampar Delivery</title>
    <link rel="stylesheet" th:href="@{/lib/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/lib/leaflet/leaflet.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<div th:fragment="menu">
    <nav class="navbar navbar-dark barra-superior fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/}"><span class="marca">Ampar</span> Delivery</a>
            <div class="d-flex align-items-center gap-3 text-white small" th:if="${usuarioSesion != null}">
                <span>
                    <strong th:text="${usuarioSesion.nombre}">Usuario</strong>
                    <span class="badge bg-light text-dark ms-1" th:text="${usuarioSesion.rol}">ROL</span>
                </span>
                <a class="text-white" th:href="@{/perfil/clave}">Cambiar contraseña</a>
                <a class="btn btn-sm btn-outline-light" th:href="@{/logout}">Salir</a>
            </div>
        </div>
    </nav>
    <aside class="menu-lateral" th:if="${usuarioSesion != null}">
        <a class="opcion-menu" th:href="@{/}" th:classappend="${rutaActual == '/'} ? 'activa'">Inicio</a>
        <div th:each="modulo : ${usuarioSesion.menu}">
            <div class="titulo-modulo" th:text="${modulo.nombre}">Módulo</div>
            <a th:each="op : ${modulo.opciones}" class="opcion-menu"
               th:href="@{${op.url}}" th:text="${op.nombre}"
               th:classappend="${rutaActual == op.url or #strings.startsWith(rutaActual, op.url + '/')} ? 'activa'">Opción</a>
        </div>
    </aside>
</div>

<div th:fragment="mensajes">
    <div class="alert alert-success" th:if="${exito}" th:text="${exito}">Éxito</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
</div>

<div th:fragment="scripts">
    <script th:src="@{/lib/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/lib/leaflet/leaflet.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

</html>
