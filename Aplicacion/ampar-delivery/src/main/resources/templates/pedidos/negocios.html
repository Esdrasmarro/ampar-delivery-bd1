<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Hacer un pedido')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Hacer un pedido</h1>
    <p class="subtitulo">Paso 1 de 3: elija un negocio. Solo los negocios abiertos reciben pedidos en este momento.</p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <form class="mb-3 d-flex gap-2" method="get">
        <select class="form-select w-auto" name="tipo" onchange="this.form.submit()">
            <option value="">Todos los tipos de negocio</option>
            <option th:each="t : ${tipos}" th:value="${t['NOMBRE']}" th:text="${t['NOMBRE']}" th:selected="${t['NOMBRE'] == tipo}"></option>
        </select>
    </form>
    <div class="row g-3">
        <div class="col-md-6 col-xl-4" th:each="n : ${negocios}">
            <div class="tarjeta h-100">
                <div class="d-flex justify-content-between">
                    <h5 class="mb-1" th:text="${n['NOMBRE']}">Negocio</h5>
                    <span th:class="${n['ABIERTO'] == 'S'} ? 'badge bg-success align-self-start' : 'badge bg-secondary align-self-start'"
                          th:text="${n['ABIERTO'] == 'S'} ? 'Abierto' : 'Cerrado'"></span>
                </div>
                <p class="small text-muted mb-3"><span th:text="${n['TIPO']}"></span> · <span th:text="${n['ZONA']}"></span> ·
                    entrega hasta <span th:text="${n['RADIO_COBERTURA_KM']}"></span> km</p>
                <a class="btn btn-sm btn-ampar" th:href="@{/pedidos/nuevo/{id}(id=${n['ID_NEGOCIO']})}">Ver catálogo</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
