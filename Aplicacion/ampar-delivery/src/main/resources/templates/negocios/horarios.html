<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Horarios')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Horarios y días de entrega</h1>
    <p class="subtitulo">Los clientes solo pueden hacer pedidos cuando el negocio está abierto y ese día hace entregas.
        Ahora el negocio está: <span th:class="${abierto == 'S'} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${abierto == 'S'} ? 'ABIERTO' : 'CERRADO'"></span></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <div class="tarjeta" style="max-width: 720px;">
        <form th:action="@{/negocios/horarios}" method="post">
            <table class="table align-middle">
                <thead><tr><th>Día</th><th>Abre</th><th>Cierra</th><th>Hace entregas</th></tr></thead>
                <tbody>
                <tr th:each="d : ${dias}">
                    <td th:text="${d['NOMBRE']}"></td>
                    <td><input class="form-control" type="time" th:name="'apertura' + ${d['DIA']}" th:value="${d['APERTURA']}" required></td>
                    <td><input class="form-control" type="time" th:name="'cierre' + ${d['DIA']}" th:value="${d['CIERRE']}" required></td>
                    <td><input class="form-check-input" type="checkbox" th:name="'entrega' + ${d['DIA']}" th:checked="${d['ENTREGA'] == 'S'}"></td>
                </tr>
                </tbody>
            </table>
            <button class="btn btn-ampar" type="submit">Guardar horarios</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
