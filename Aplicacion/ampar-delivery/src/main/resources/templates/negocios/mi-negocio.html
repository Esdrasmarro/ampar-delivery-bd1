<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Mi negocio')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo" th:text="${n['NOMBRE']}">Mi negocio</h1>
    <p class="subtitulo">
        <span th:text="${n['TIPO']}"></span> · <span th:text="${n['ZONA']}"></span> · NIT <span th:text="${n['NIT']}"></span> ·
        Estado: <strong th:text="${n['ESTADO']}"></strong> ·
        <span th:class="${n['ABIERTO'] == 'S'} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${n['ABIERTO'] == 'S'} ? 'Abierto ahora' : 'Cerrado ahora'"></span>
    </p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/negocios/mi-negocio}" method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" th:value="${n['NOMBRE']}" required></div>
            <div class="col-md-6"><label class="form-label">Propietario</label><input class="form-control" name="propietario" th:value="${n['PROPIETARIO']}" required></div>
            <div class="col-md-4"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" th:value="${n['TELEFONO']}" required></div>
            <div class="col-md-8"><label class="form-label">Dirección</label><input class="form-control" name="direccion" th:value="${n['DIRECCION']}" required></div>
            <div class="col-md-4"><label class="form-label">Latitud</label><input class="form-control" id="latitud" name="latitud" th:value="${n['LATITUD']}" required></div>
            <div class="col-md-4"><label class="form-label">Longitud</label><input class="form-control" id="longitud" name="longitud" th:value="${n['LONGITUD']}" required></div>
            <div class="col-md-4"><label class="form-label">Radio de cobertura (km)</label><input class="form-control" type="number" step="0.5" name="radio" th:value="${n['RADIO_COBERTURA_KM']}" required></div>
            <div class="col-12"><div id="mapa" class="mapa"></div></div>
            <div class="col-12"><button class="btn btn-ampar" type="submit">Guardar</button></div>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
<script>mapaSelector('mapa', 'latitud', 'longitud');</script>
</body>
</html>
