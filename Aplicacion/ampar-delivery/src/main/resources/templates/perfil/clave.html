<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Cambiar contraseña')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <div class="tarjeta" style="max-width: 480px;">
        <h1 class="titulo">Cambiar contraseña</h1>
        <p class="subtitulo">La contraseña se guarda encriptada (SHA-256).</p>
        <div th:replace="~{fragmentos/base :: mensajes}"></div>
        <form th:action="@{/perfil/clave}" method="post">
            <div class="mb-3"><label class="form-label">Contraseña actual</label><input class="form-control" type="password" name="actual" required></div>
            <div class="mb-3"><label class="form-label">Contraseña nueva</label><input class="form-control" type="password" name="nueva" required minlength="6"></div>
            <div class="mb-3"><label class="form-label">Repetir contraseña nueva</label><input class="form-control" type="password" name="nueva2" required minlength="6"></div>
            <button class="btn btn-ampar" type="submit">Guardar</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
