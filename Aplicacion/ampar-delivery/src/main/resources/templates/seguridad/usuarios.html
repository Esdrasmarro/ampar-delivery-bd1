<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <div class="d-flex justify-content-between align-items-start">
        <div><h1 class="titulo">Usuarios</h1>
            <p class="subtitulo">Usuarios de la aplicación. La contraseña se guarda encriptada con SHA-256.</p></div>
        <a class="btn btn-ampar" th:href="@{/seguridad/usuarios/nuevo}">+ Nuevo usuario</a>
    </div>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <div class="tarjeta">
        <form class="row g-2 mb-3" method="get">
            <div class="col-md-5"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar por usuario o nombre..."></div>
            <div class="col-auto"><button class="btn btn-outline-primary">Buscar</button></div>
        </form>
        <table class="table table-sm table-hover align-middle">
            <thead><tr><th>No.</th><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Creado</th><th></th></tr></thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u['ID_USUARIO']}"></td>
                <td th:text="${u['NOMBRE_USUARIO']}"></td>
                <td th:text="${u['NOMBRE_COMPLETO']}"></td>
                <td th:text="${u['ROL']}"></td>
                <td><span th:text="${u['ESTADO'] == 'A'} ? 'Activo' : 'Inactivo'" th:classappend="${u['ESTADO'] != 'A'} ? 'badge bg-secondary'"></span></td>
                <td th:text="${#dates.format(u['FECHA_CREACION'], 'dd/MM/yyyy')}"></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/seguridad/usuarios/editar/{id}(id=${u['ID_USUARIO']})}">Editar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
