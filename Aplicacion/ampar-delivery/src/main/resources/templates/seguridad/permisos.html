<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Permisos por rol')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Permisos por rol</h1>
    <p class="subtitulo">Marque las opciones del menú que puede usar cada rol (tabla ROL_MENU). Se guardan en una sola transacción.</p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>
    <div class="tarjeta">
        <form method="get" class="row g-2 mb-3">
            <div class="col-md-4"><select class="form-select" name="idRol" onchange="this.form.submit()">
                <option th:each="r : ${roles}" th:value="${r['ID_ROL']}" th:text="${r['NOMBRE']}"
                        th:selected="${#strings.toString(r['ID_ROL']) == #strings.toString(idRol)}"></option>
            </select></div>
        </form>
        <form th:action="@{/seguridad/permisos}" method="post">
            <input type="hidden" name="idRol" th:value="${idRol}">
            <table class="table table-sm align-middle">
                <thead><tr><th style="width: 60px;">Permiso</th><th>Módulo</th><th>Opción del menú</th><th>Dirección</th></tr></thead>
                <tbody>
                <tr th:each="o : ${opciones}">
                    <td><input class="form-check-input" type="checkbox" name="menus" th:value="${o['ID_MENU']}" th:checked="${o['ASIGNADO'] == 'S'}"></td>
                    <td th:text="${o['MODULO']}"></td>
                    <td th:text="${o['OPCION']}"></td>
                    <td><code th:text="${o['URL']}"></code></td>
                </tr>
                </tbody>
            </table>
            <button class="btn btn-ampar" type="submit">Guardar permisos</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
