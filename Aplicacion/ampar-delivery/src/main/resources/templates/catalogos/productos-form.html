<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Catálogo de productos')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Catálogo de productos</h1>
    <p class="subtitulo" th:text="${fila['ID_PRODUCTO'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_PRODUCTO']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/negocios/productos/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_PRODUCTO']}">
            <div class="col-md-6">
                <label class="form-label" for="idCategoria">Categoría<span class="text-danger"> *</span></label>
                <select class="form-select" id="idCategoria" name="idCategoria" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="o : ${categorias}" th:value="${o['ID']}" th:text="${o['TEXTO']}"
                            th:selected="${#strings.toString(o['ID']) == #strings.toString(fila['ID_CATEGORIA'])}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="nombre">Nombre<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" th:value="${fila['NOMBRE']}" required>
            </div>
            <div class="col-12">
                <label class="form-label" for="descripcion">Descripción / especificaciones</label>
                <textarea class="form-control" rows="3" id="descripcion" name="descripcion" th:text="${fila['DESCRIPCION']}"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="precio">Precio (Q)<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="any" id="precio" name="precio" th:value="${fila['PRECIO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="disponible">Disponible<span class="text-danger"> *</span></label>
                <select class="form-select" id="disponible" name="disponible" required>
                    <option value="S" th:selected="${#strings.toString(fila['DISPONIBLE']) == 'S'}">Sí</option>
                    <option value="N" th:selected="${#strings.toString(fila['DISPONIBLE']) == 'N'}">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="estado">Estado<span class="text-danger"> *</span></label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="A" th:selected="${#strings.toString(fila['ESTADO']) == 'A'}">Activo</option>
                    <option value="I" th:selected="${#strings.toString(fila['ESTADO']) == 'I'}">Inactivo</option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/negocios/productos}">Cancelar</a>
            </div>
        </form>
        <form th:if="${fila['ID_PRODUCTO'] != null}" class="mt-4 pt-3 border-top" th:action="@{/negocios/productos/baja/{id}(id=${fila['ID_PRODUCTO']})}" method="post">
            <p class="small text-muted mb-2">Dar de baja cambia el estado a inactivo (baja lógica); el registro no se borra.</p>
            <button class="btn btn-outline-danger btn-sm" type="submit">Dar de baja</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
