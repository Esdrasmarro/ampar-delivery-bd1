<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Negocios afiliados')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Negocios afiliados</h1>
    <p class="subtitulo" th:text="${fila['ID_NEGOCIO'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_NEGOCIO']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/negocios/lista/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_NEGOCIO']}">
            <div class="col-md-6">
                <label class="form-label" for="idTipoNegocio">Tipo<span class="text-danger"> *</span></label>
                <select class="form-select" id="idTipoNegocio" name="idTipoNegocio" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="o : ${tipos}" th:value="${o['ID']}" th:text="${o['TEXTO']}"
                            th:selected="${#strings.toString(o['ID']) == #strings.toString(fila['ID_TIPO_NEGOCIO'])}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="idZona">Zona<span class="text-danger"> *</span></label>
                <select class="form-select" id="idZona" name="idZona" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="o : ${zonas}" th:value="${o['ID']}" th:text="${o['TEXTO']}"
                            th:selected="${#strings.toString(o['ID']) == #strings.toString(fila['ID_ZONA'])}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="nombre">Nombre<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" th:value="${fila['NOMBRE']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="nit">NIT<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nit" name="nit" th:value="${fila['NIT']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="propietario">Propietario<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="propietario" name="propietario" th:value="${fila['PROPIETARIO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="telefono">Teléfono<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="telefono" name="telefono" th:value="${fila['TELEFONO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="correo">Correo<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="correo" name="correo" th:value="${fila['CORREO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="direccion">Dirección<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="direccion" name="direccion" th:value="${fila['DIRECCION']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="latitud">Latitud<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="any" id="latitud" name="latitud" th:value="${fila['LATITUD']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="longitud">Longitud<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="any" id="longitud" name="longitud" th:value="${fila['LONGITUD']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="radioCoberturaKm">Cobertura (km)<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="any" id="radioCoberturaKm" name="radioCoberturaKm" th:value="${fila['RADIO_COBERTURA_KM']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="estado">Estado<span class="text-danger"> *</span></label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="PENDIENTE" th:selected="${#strings.toString(fila['ESTADO']) == 'PENDIENTE'}">Pendiente</option>
                    <option value="ACTIVO" th:selected="${#strings.toString(fila['ESTADO']) == 'ACTIVO'}">Activo</option>
                    <option value="RECHAZADO" th:selected="${#strings.toString(fila['ESTADO']) == 'RECHAZADO'}">Rechazado</option>
                    <option value="INACTIVO" th:selected="${#strings.toString(fila['ESTADO']) == 'INACTIVO'}">Inactivo</option>
                </select>
            </div>
            <div class="col-12">
                <p class="small text-muted mb-1">Haga clic en el mapa para llenar la latitud y la longitud.</p>
                <div id="mapa" class="mapa"></div>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/negocios/lista}">Cancelar</a>
            </div>
        </form>
        <form th:if="${fila['ID_NEGOCIO'] != null}" class="mt-4 pt-3 border-top" th:action="@{/negocios/lista/baja/{id}(id=${fila['ID_NEGOCIO']})}" method="post">
            <p class="small text-muted mb-2">Dar de baja cambia el estado a inactivo (baja lógica); el registro no se borra.</p>
            <button class="btn btn-outline-danger btn-sm" type="submit">Dar de baja</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
<script>mapaSelector('mapa', 'latitud', 'longitud');</script>
</body>
</html>
