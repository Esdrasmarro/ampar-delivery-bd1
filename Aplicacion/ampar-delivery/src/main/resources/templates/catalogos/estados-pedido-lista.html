<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Estados de pedido')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="titulo">Estados de pedido</h1>
            <p class="subtitulo">Los estados los usa el sistema; solo se puede cambiar su nombre y orden.</p>
        </div>
    </div>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta">
        <form class="row g-2 mb-3" method="get" th:action="@{/catalogos/estados-pedido}">
            <div class="col-md-5"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar..."></div>
            <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Buscar</button></div>
            <div class="col-auto"><a class="btn btn-link" th:href="@{/catalogos/estados-pedido}">Ver todos</a></div>
            <div class="col text-end text-muted small align-self-center" th:text="${filas.size()} + ' registro(s)'"></div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover table-sm align-middle">
                <thead>
                <tr><th>No.</th><th>Nombre</th><th>Orden en el flujo</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${filas}">
                    <td th:text="${f['ID_ESTADO_PEDIDO']}"></td>
                    <td th:text="${f['NOMBRE']}"></td>
                    <td th:text="${f['ORDEN']}"></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/catalogos/estados-pedido/editar/{id}(id=${f['ID_ESTADO_PEDIDO']})}">Editar</a></td>
                </tr>
                <tr th:if="${filas.isEmpty()}"><td colspan="20" class="text-center text-muted">No hay registros.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
