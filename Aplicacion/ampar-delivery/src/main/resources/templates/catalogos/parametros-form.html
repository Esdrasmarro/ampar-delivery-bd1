<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Parámetros del sistema')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Parámetros del sistema</h1>
    <p class="subtitulo" th:text="${fila['ID_PARAMETRO'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_PARAMETRO']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/catalogos/parametros/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_PARAMETRO']}">
            <div class="col-md-6">
                <label class="form-label" for="codigo">Código<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="codigo" name="codigo" th:value="${fila['CODIGO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="valor">Valor<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="any" id="valor" name="valor" th:value="${fila['VALOR']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="descripcion">Descripción<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="descripcion" name="descripcion" th:value="${fila['DESCRIPCION']}" required>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/catalogos/parametros}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
