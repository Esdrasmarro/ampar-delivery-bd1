<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Clientes')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Clientes</h1>
    <p class="subtitulo" th:text="${fila['ID_CLIENTE'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_CLIENTE']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/catalogos/clientes/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_CLIENTE']}">
            <div class="col-md-6">
                <label class="form-label" for="nombres">Nombres<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nombres" name="nombres" th:value="${fila['NOMBRES']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="apellidos">Apellidos<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="apellidos" name="apellidos" th:value="${fila['APELLIDOS']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="telefono">Teléfono<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="telefono" name="telefono" th:value="${fila['TELEFONO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="correo">Correo<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="correo" name="correo" th:value="${fila['CORREO']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="estado">Estado<span class="text-danger"> *</span></label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="A" th:selected="${#strings.toString(fila['ESTADO']) == 'A'}">Activo</option>
                    <option value="I" th:selected="${#strings.toString(fila['ESTADO']) == 'I'}">Inactivo</option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/catalogos/clientes}">Cancelar</a>
            </div>
        </form>
        <form th:if="${fila['ID_CLIENTE'] != null}" class="mt-4 pt-3 border-top" th:action="@{/catalogos/clientes/baja/{id}(id=${fila['ID_CLIENTE']})}" method="post">
            <p class="small text-muted mb-2">Dar de baja cambia el estado a inactivo (baja lógica); el registro no se borra.</p>
            <button class="btn btn-outline-danger btn-sm" type="submit">Dar de baja</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
