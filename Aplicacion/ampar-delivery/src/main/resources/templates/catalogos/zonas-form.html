<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Zonas y zonas rojas')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Zonas y zonas rojas</h1>
    <p class="subtitulo" th:text="${fila['ID_ZONA'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_ZONA']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/catalogos/zonas/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_ZONA']}">
            <div class="col-md-6">
                <label class="form-label" for="idMunicipio">Municipio<span class="text-danger"> *</span></label>
                <select class="form-select" id="idMunicipio" name="idMunicipio" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="o : ${municipios}" th:value="${o['ID']}" th:text="${o['TEXTO']}"
                            th:selected="${#strings.toString(o['ID']) == #strings.toString(fila['ID_MUNICIPIO'])}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="nombre">Nombre<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" th:value="${fila['NOMBRE']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="zonaRoja">Zona roja<span class="text-danger"> *</span></label>
                <select class="form-select" id="zonaRoja" name="zonaRoja" required>
                    <option value="N" th:selected="${#strings.toString(fila['ZONA_ROJA']) == 'N'}">No</option>
                    <option value="S" th:selected="${#strings.toString(fila['ZONA_ROJA']) == 'S'}">Sí</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="observacion">Observación</label>
                <textarea class="form-control" rows="3" id="observacion" name="observacion" th:text="${fila['OBSERVACION']}"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="estado">Estado<span class="text-danger"> *</span></label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="A" th:selected="${#strings.toString(fila['ESTADO']) == 'A'}">Activo</option>
                    <option value="I" th:selected="${#strings.toString(fila['ESTADO']) == 'I'}">Inactivo</option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/catalogos/zonas}">Cancelar</a>
            </div>
        </form>
        <form th:if="${fila['ID_ZONA'] != null}" class="mt-4 pt-3 border-top" th:action="@{/catalogos/zonas/baja/{id}(id=${fila['ID_ZONA']})}" method="post">
            <p class="small text-muted mb-2">Dar de baja cambia el estado a inactivo (baja lógica); el registro no se borra.</p>
            <button class="btn btn-outline-danger btn-sm" type="submit">Dar de baja</button>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
