<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Opciones de menú')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="titulo">Opciones de menú</h1>
            <p class="subtitulo"></p>
        </div>
        <a class="btn btn-ampar" th:href="@{/seguridad/menus/nuevo}">+ Nuevo</a>
    </div>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta">
        <form class="row g-2 mb-3" method="get" th:action="@{/seguridad/menus}">
            <div class="col-md-5"><input class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar..."></div>
            <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Buscar</button></div>
            <div class="col-auto"><a class="btn btn-link" th:href="@{/seguridad/menus}">Ver todos</a></div>
            <div class="col text-end text-muted small align-self-center" th:text="${filas.size()} + ' registro(s)'"></div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover table-sm align-middle">
                <thead>
                <tr><th>No.</th><th>Módulo</th><th>Texto en el menú</th><th>Dirección (URL)</th><th>Orden</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${filas}">
                    <td th:text="${f['ID_MENU']}"></td>
                    <td th:text="${f['MODULO']}"></td>
                    <td th:text="${f['NOMBRE']}"></td>
                    <td th:text="${f['URL']}"></td>
                    <td th:text="${f['ORDEN']}"></td>
                    <td><span th:text="${f['ESTADO'] == 'A'} ? 'Activo' : 'Inactivo'" th:classappend="${f['ESTADO'] == 'I'} ? 'badge bg-secondary'"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/seguridad/menus/editar/{id}(id=${f['ID_MENU']})}">Editar</a></td>
                </tr>
                <tr th:if="${filas.isEmpty()}"><td colspan="20" class="text-center text-muted">No hay registros.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
