<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Estados de pedido')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido">
    <h1 class="titulo">Estados de pedido</h1>
    <p class="subtitulo" th:text="${fila['ID_ESTADO_PEDIDO'] == null} ? 'Nuevo registro (alta)' : 'Modificar el registro No. ' + ${fila['ID_ESTADO_PEDIDO']} + ' (cambio)'"></p>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="tarjeta" style="max-width: 900px;">
        <form th:action="@{/catalogos/estados-pedido/guardar}" method="post" class="row g-3">
            <input type="hidden" name="id" th:value="${fila['ID_ESTADO_PEDIDO']}">
            <div class="col-md-6">
                <label class="form-label" for="nombre">Nombre<span class="text-danger"> *</span></label>
                <input class="form-control" type="text" id="nombre" name="nombre" th:value="${fila['NOMBRE']}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="orden">Orden en el flujo<span class="text-danger"> *</span></label>
                <input class="form-control" type="number" step="1" id="orden" name="orden" th:value="${fila['ORDEN']}" required>
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-ampar" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/catalogos/estados-pedido}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
