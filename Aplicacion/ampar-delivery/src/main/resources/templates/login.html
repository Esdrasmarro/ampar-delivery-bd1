<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Iniciar sesión')}"></head>
<body>
<div th:replace="~{fragmentos/base :: menu}"></div>
<main class="contenido-publico" style="max-width: 440px;">
    <div class="tarjeta">
        <h1 class="titulo">Iniciar sesión</h1>
        <p class="subtitulo">Ingrese su usuario y contraseña.</p>
        <div th:replace="~{fragmentos/base :: mensajes}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input class="form-control" name="usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input class="form-control" type="password" name="clave" required>
            </div>
            <button class="btn btn-ampar w-100" type="submit">Entrar</button>
        </form>
        <p class="small text-muted mt-3 mb-0">Tiene 3 intentos. Si se equivoca 3 veces regresará al inicio.</p>
        <p class="small mt-2 mb-0">¿No tiene cuenta? <a th:href="@{/registro}">Regístrese como cliente</a></p>
    </div>
</main>
<div th:replace="~{fragmentos/base :: scripts}"></div>
</body>
</html>
